  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="08-beyond"]');
      function q(id) { return root.querySelector('[id="' + id + '"]'); }

      var tl = gsap.timeline({ paused: true });

      var world = q("08-beyond-world");
      var slime = q("08-beyond-slime");
      var hop = q("08-beyond-hop");
      var pupils = q("08-beyond-pupils");
      var eyes = q("08-beyond-eyes");
      var tassel = q("08-beyond-tassel");
      var label = q("08-beyond-label");
      var rule = q("08-beyond-rule");

      // ---- Scene 1 (0.0–1.8s): board, slime hop, label types on VO ----
      // slow camera push-in under the whole shot, settling by the hold
      tl.fromTo(world, { scale: 1 }, { scale: 1.03, duration: 6.0, ease: "power1.inOut" }, 0);

      // slime arrival (visible well before 0.5s)
      tl.fromTo(slime, { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);

      // single hop with squash / stretch, tassel swings
      tl.fromTo(hop, { y: 0, scaleX: 1, scaleY: 1 }, { scaleX: 1.08, scaleY: 0.9, duration: 0.16, ease: "power2.out" }, 0.4);
      tl.to(hop, { y: -58, scaleX: 0.95, scaleY: 1.07, duration: 0.26, ease: "power2.out" }, 0.56);
      tl.to(hop, { y: 0, scaleX: 1, scaleY: 1, duration: 0.22, ease: "power2.in" }, 0.82);
      tl.to(hop, { scaleX: 1.07, scaleY: 0.92, duration: 0.1, ease: "power2.out" }, 1.04);
      tl.to(hop, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "power3.out" }, 1.14);
      tl.fromTo(tassel, { rotation: 0 }, { rotation: -10, svgOrigin: "64 36", duration: 0.26, ease: "power2.out" }, 0.56);
      tl.to(tassel, { rotation: 6, svgOrigin: "64 36", duration: 0.3, ease: "power2.inOut" }, 0.82);
      tl.to(tassel, { rotation: 0, svgOrigin: "64 36", duration: 0.4, ease: "power3.out" }, 1.12);

      // kicker stub + typed label ("math is where we start")
      tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.05);
      var text = "math is where we start";
      var chars = [];
      for (var i = 0; i < text.length; i++) {
        var s = document.createElement("span");
        s.textContent = text[i];
        label.appendChild(s);
        chars.push(s);
      }
      var TYPE_START = 0.1, TYPE_END = 1.36;
      var step = (TYPE_END - TYPE_START) / chars.length;
      chars.forEach(function (c, i) {
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, TYPE_START + i * step);
      });

      // ---- Scene 2 (1.8–6.0s): sticky notes slap on, eyes follow ----
      var notes = [
        { id: "08-beyond-note-a", at: 2.06, rot: -3,  look: [-3.2, -1.6] },
        { id: "08-beyond-note-b", at: 2.92, rot: 2,   look: [3.2, -1.8] },
        { id: "08-beyond-note-c", at: 3.80, rot: 2.5, look: [-3.2, 2.0] },
        { id: "08-beyond-note-d", at: 4.77, rot: -2,  look: [3.2, 2.0] }
      ];

      var firstLook = true;
      notes.forEach(function (n, i) {
        var note = q(n.id);
        var paper = note.querySelector('[class~="08-beyond-paper"]');
        var doodlePaths = note.querySelectorAll('[class~="08-beyond-doodle"] path');
        var landAt = n.at + 0.16;

        // eyes glance toward the note just ahead of its arrival
        if (firstLook) {
          tl.fromTo(pupils, { x: 0, y: 0 }, { x: n.look[0], y: n.look[1], duration: 0.22, ease: "power2.out" }, n.at - 0.14);
          firstLook = false;
        } else {
          tl.to(pupils, { x: n.look[0], y: n.look[1], duration: 0.22, ease: "power2.out" }, n.at - 0.14);
        }

        // spring-pop entrance (power3 settle) with a small hand-placed rotation
        tl.fromTo(note,
          { scale: 0, opacity: 0, rotation: n.rot + (i % 2 ? 7 : -7), y: -14 },
          { scale: 1, opacity: 1, rotation: n.rot, y: 0, duration: 0.5, ease: "power3.out" },
          n.at);

        // press squash on landing (paper layer only)
        tl.fromTo(paper, { scaleX: 1, scaleY: 1 }, { scaleX: 1.035, scaleY: 0.94, duration: 0.09, ease: "power2.out" }, landAt);
        tl.to(paper, { scaleX: 1, scaleY: 1, duration: 0.32, ease: "power3.out" }, landAt + 0.09);

        // doodle draws in after the slap
        tl.fromTo(doodlePaths, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut", stagger: 0.1 }, n.at + 0.3);

        // slime reacts with a tiny bob
        tl.to(hop, { scaleX: 1.04, scaleY: 0.96, duration: 0.1, ease: "power2.out" }, landAt);
        tl.to(hop, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "power3.out" }, landAt + 0.1);
      });

      // "one board": eyes return to camera
      tl.to(pupils, { x: 0, y: 0, duration: 0.3, ease: "power2.inOut" }, 5.8);

      // ---- Scene 3 (6.0–7.0s): hold, slime blinks ----
      tl.fromTo(eyes, { scaleY: 1 }, { scaleY: 0.08, svgOrigin: "64 82", duration: 0.07, ease: "power2.in" }, 6.25);
      tl.to(eyes, { scaleY: 1, svgOrigin: "64 82", duration: 0.12, ease: "power2.out" }, 6.32);

      // pad timeline to the full frame length
      tl.set({}, {}, 7);

      window.__timelines = window.__timelines || {};
      window.__timelines["08-beyond"] = tl;
    })();
  </script>
