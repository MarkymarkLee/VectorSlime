<script>
(function () {
  var $ = function (id) { return document.getElementById("09-your-turn-" + id); };
  var tl = gsap.timeline({ paused: true });

  var slime = $("slime"), shadow = $("shadow"), body = $("body"), eyes = $("eyes"),
      hat = $("hat"), tassel = $("tassel"), pill = $("pill"), word = $("word"), tag = $("tag");

  // Build the pill's typed characters (each carries its own trailing caret).
  var PILL_TEXT = "Your turn";
  var chars = [], carets = [];
  for (var i = 0; i < PILL_TEXT.length; i++) {
    var s = document.createElement("span");
    s.className = "ch";
    s.textContent = PILL_TEXT[i];
    var k = document.createElement("span");
    k.className = "k";
    s.appendChild(k);
    pill.appendChild(s);
    chars.push(s); carets.push(k);
  }

  gsap.set([body, eyes, hat, tassel], { transformBox: "fill-box" });
  gsap.set(body, { transformOrigin: "50% 100%" });
  gsap.set(eyes, { transformOrigin: "50% 50%" });
  gsap.set(hat, { transformOrigin: "50% 100%" });
  gsap.set(tassel, { transformOrigin: "0% 0%" });

  // ── Scene 1 (0.0–2.2s): persistent mark, eyes on camera, idle squash on "So"
  tl.fromTo(slime, { opacity: 0, y: 18, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 0);
  tl.fromTo(shadow, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power3.out" }, 0);

  // "So" (0.07) — soft squash and recover
  tl.fromTo(body, { scaleX: 1, scaleY: 1 }, { scaleX: 1.05, scaleY: 0.93, duration: 0.18, ease: "power2.out", immediateRender: false }, 0.07);
  tl.to(shadow, { scaleX: 1.06, duration: 0.18, ease: "power2.out" }, 0.07);
  tl.to(body, { scaleX: 1, scaleY: 1, duration: 0.5, ease: "power3.out" }, 0.25);
  tl.to(shadow, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.25);

  // "want" (0.72) — hat tips, tassel swings
  tl.to(hat, { rotation: -4, duration: 0.25, ease: "power2.out" }, 0.72);
  tl.to(tassel, { rotation: 8, duration: 0.25, ease: "power2.out" }, 0.72);
  tl.to(hat, { rotation: 0, duration: 0.55, ease: "power3.out" }, 0.97);
  tl.to(tassel, { rotation: 0, duration: 0.7, ease: "power3.out" }, 0.97);

  // "think" (1.14) — body breathes in
  tl.to(body, { scaleY: 1.03, scaleX: 0.985, duration: 0.4, ease: "sine.inOut" }, 1.14);
  // "today" (1.62) — small lift, settle as the question ends
  tl.to(slime, { y: -10, duration: 0.28, ease: "power2.out" }, 1.62);
  tl.to(shadow, { scaleX: 0.9, opacity: 0.75, duration: 0.28, ease: "power2.out" }, 1.62);
  tl.to(body, { scaleY: 1, scaleX: 1, duration: 0.4, ease: "power3.out" }, 1.62);
  tl.to(slime, { y: 0, duration: 0.5, ease: "power3.out" }, 1.9);
  tl.to(shadow, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.9);

  // ── Scene 2 (2.2–3.0s): "Your turn" pill spring-pops; typed in with a caret; slime blinks
  tl.fromTo(pill, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.2);
  gsap.set(chars, { opacity: 0 });
  var TYPE_AT = 2.3, PER_CHAR = 0.045;
  for (var j = 0; j < chars.length; j++) {
    var t = TYPE_AT + j * PER_CHAR;
    tl.set(chars[j], { opacity: 1 }, t);
    tl.set(carets[j], { opacity: 1 }, t);
    if (j > 0) tl.set(carets[j - 1], { opacity: 0 }, t);
  }
  var last = carets[carets.length - 1];
  var typedEnd = TYPE_AT + (chars.length - 1) * PER_CHAR;
  // two deterministic caret blinks, then the caret leaves (the pill is the cam's settled state)
  tl.set(last, { opacity: 0 }, typedEnd + 0.25);
  tl.set(last, { opacity: 1 }, typedEnd + 0.5);
  tl.set(last, { opacity: 0 }, typedEnd + 0.75);

  // blink
  tl.to(eyes, { scaleY: 0.1, duration: 0.07, ease: "power2.in" }, 2.45);
  tl.to(eyes, { scaleY: 1, duration: 0.12, ease: "power2.out" }, 2.52);

  // ── Scene 3 (3.0–6.0s): lockup rises in sequence, then holds still
  var BASE_DURATION = 0.5, SEC_PER_CHAR = 0.03;
  var LOCKUP = [ { el: word, text: "VectorSlime", rise: 28 }, { el: tag, text: "a shared space to think.", rise: 20 } ];
  var cursor = 3.0;
  LOCKUP.forEach(function (entry) {
    entry.start = cursor;
    cursor += BASE_DURATION + entry.text.length * SEC_PER_CHAR;
  });
  LOCKUP.forEach(function (entry) {
    tl.fromTo(entry.el, { opacity: 0, y: entry.rise }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, entry.start);
  });

  // one last blink as the tagline lands, then everything holds still to the end
  tl.to(eyes, { scaleY: 0.1, duration: 0.07, ease: "power2.in" }, 4.45);
  tl.to(eyes, { scaleY: 1, duration: 0.12, ease: "power2.out" }, 4.52);

  // anchor the timeline to the full 6s duration (final hold, no exit)
  tl.set({}, {}, 6);

  window.__timelines = window.__timelines || {};
  window.__timelines["09-your-turn"] = tl;
})();
</script>
