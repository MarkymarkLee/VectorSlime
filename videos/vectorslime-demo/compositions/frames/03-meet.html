  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="03-meet"]');
      var q = function (n) { return root.querySelector('[class~="03-meet-' + n + '"]'); };
      var qa = function (n) { return Array.prototype.slice.call(root.querySelectorAll('[class~="03-meet-' + n + '"]')); };

      var slime = q("slime"), body = q("g-body"), eyes = q("g-eyes"), hat = q("g-hat"), tassel = q("g-tassel");
      var shadow = q("shadow"), glow = q("glow");
      var t1 = q("t1"), t2 = q("t2"), c1 = q("c1"), c2 = q("c2");

      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.0–0.9s): drop, squash, hat lag, tassel swing ----------
      var LAND = 0.42;
      tl.fromTo(slime, { y: -900 }, { y: 0, duration: LAND, ease: "power2.in" }, 0);
      // stretch while falling
      tl.fromTo(body, { scaleX: 0.94, scaleY: 1.08, svgOrigin: "64 111" },
        { scaleX: 0.94, scaleY: 1.08, svgOrigin: "64 111", duration: LAND, ease: "none" }, 0);
      // land: squash -> stretch-recover -> settle
      tl.to(body, { scaleX: 1.15, scaleY: 0.8, duration: 0.1, ease: "power2.out" }, LAND);
      tl.to(body, { scaleX: 0.96, scaleY: 1.06, duration: 0.15, ease: "power2.inOut" }, LAND + 0.1);
      tl.to(body, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "power3.out" }, LAND + 0.25);

      // hat floats on the fall, lags into the squash, then wobbles to rest
      tl.fromTo(hat, { y: -6, rotation: 0, svgOrigin: "64 50" },
        { y: -6, rotation: 0, svgOrigin: "64 50", duration: LAND, ease: "none" }, 0);
      tl.to(hat, { y: 14, rotation: -8, duration: 0.13, ease: "power2.out" }, LAND + 0.03);
      tl.to(hat, { y: -5, rotation: 6, duration: 0.2, ease: "power2.inOut" }, LAND + 0.16);
      tl.to(hat, { y: 1.5, rotation: -3.5, duration: 0.22, ease: "sine.inOut" }, LAND + 0.36);
      tl.to(hat, { y: 0, rotation: 1.2, duration: 0.22, ease: "sine.inOut" }, LAND + 0.58);
      tl.to(hat, { y: 0, rotation: 0, duration: 0.3, ease: "sine.out" }, LAND + 0.8);

      // tassel trails up on the fall, swings on landing, damps out
      tl.fromTo(tassel, { rotation: -12, svgOrigin: "64 36" },
        { rotation: -12, svgOrigin: "64 36", duration: LAND, ease: "none" }, 0);
      tl.to(tassel, { rotation: 18, duration: 0.2, ease: "power2.out" }, LAND + 0.05);
      tl.to(tassel, { rotation: -10, duration: 0.28, ease: "sine.inOut" }, LAND + 0.25);
      tl.to(tassel, { rotation: 6, duration: 0.28, ease: "sine.inOut" }, LAND + 0.53);
      tl.to(tassel, { rotation: -3, duration: 0.28, ease: "sine.inOut" }, LAND + 0.81);
      tl.to(tassel, { rotation: 0, duration: 0.35, ease: "sine.out" }, LAND + 1.09);

      // soft floor shadow grows as the slime nears, spreads on squash
      tl.fromTo(shadow, { scaleX: 0.25, opacity: 0 }, { scaleX: 0.92, opacity: 0.4, duration: LAND, ease: "power2.in" }, 0);
      tl.to(shadow, { scaleX: 1.12, opacity: 0.55, duration: 0.1, ease: "power2.out" }, LAND);
      tl.to(shadow, { scaleX: 1, opacity: 0.45, duration: 0.4, ease: "power3.out" }, LAND + 0.1);

      // ---------- Scene 2 (0.9–2.4s): wordmark waterfall, slime blinks + looks right ----------
      var chars = qa("ch");
      var WM_AT = 0.95, STAG = 0.045;
      chars.forEach(function (el, i) {
        tl.fromTo(el, { x: 140, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, WM_AT + i * STAG);
      });
      // blink then turn eyes toward the wordmark
      tl.fromTo(eyes, { scaleY: 1, x: 0, svgOrigin: "64 82" },
        { scaleY: 0.1, x: 0, svgOrigin: "64 82", duration: 0.07, ease: "power2.in" }, 1.0);
      tl.to(eyes, { scaleY: 1, duration: 0.09, ease: "power2.out" }, 1.07);
      tl.to(eyes, { x: 3.2, duration: 0.35, ease: "power2.inOut" }, 1.25);

      // ---------- Scene 3 (2.4–6.0s): tagline types on with caret; glow blooms once ----------
      // content-aware sequencing: each line's typing window derived from its length
      var SEC_PER_CHAR = 0.04, BASE = 0.1;
      var CONTENT = [
        { el: t1, caret: c1, text: "don't ask AI for answers.", hold: 0.3 },
        { el: t2, caret: c2, text: "think with it.", hold: 0 }
      ];
      var cursor = 2.45;
      var LINES = CONTENT.map(function (e) {
        var type = BASE + e.text.length * SEC_PER_CHAR;
        var start = cursor;
        cursor += type + e.hold;
        return { el: e.el, caret: e.caret, text: e.text, start: start, end: start + type };
      });
      var TYPE_START = LINES[0].start, TYPE_DUR = 6 - TYPE_START;
      var driver = { t: TYPE_START };
      var last = ["", ""], lastCaret = "";
      tl.fromTo(driver, { t: TYPE_START }, {
        t: 6, duration: TYPE_DUR, ease: "none",
        onUpdate: function () {
          var t = driver.t, active = 0;
          LINES.forEach(function (L, i) {
            var p = Math.max(0, Math.min(1, (t - L.start) / (L.end - L.start)));
            var s = L.text.slice(0, Math.round(p * L.text.length));
            if (s !== last[i]) { L.el.textContent = s; last[i] = s; }
            if (t >= L.start) active = i;
          });
          var A = LINES[active];
          var typing = t > A.start && t < A.end;
          var on = typing || (t >= A.end && Math.floor((t - A.end) / 0.45) % 2 === 0);
          var key = active + ":" + (on ? 1 : 0);
          if (key !== lastCaret) {
            c1.style.opacity = (active === 0 && on) ? "1" : "0";
            c2.style.opacity = (active === 1 && on) ? "1" : "0";
            lastCaret = key;
          }
        }
      }, TYPE_START);

      // glow blooms once as "think with it." lands
      var BLOOM = LINES[1].start;
      tl.fromTo(glow, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1.05, duration: 0.7, ease: "power2.out" }, BLOOM);
      tl.to(glow, { opacity: 0.45, scale: 1, duration: 1.2, ease: "sine.inOut" }, BLOOM + 0.7);

      // a single late blink keeps the held lockup alive
      tl.to(eyes, { scaleY: 0.1, duration: 0.07, ease: "power2.in" }, 4.9);
      tl.to(eyes, { scaleY: 1, duration: 0.09, ease: "power2.out" }, 4.97);

      // pad to full duration
      tl.set({}, {}, 6);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-meet"] = tl;
    })();
  </script>
