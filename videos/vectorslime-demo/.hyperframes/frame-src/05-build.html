        const tl = gsap.timeline({ paused: true });
        const DUR = 10;

        // Window hairline settles in with the frame (no exit).
        tl.fromTo("#f05-build-frame-line", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

        // Scene 1 — chip springs in on "We share one infinite whiteboard" (spring-pop-entrance).

          2.6,

        const SEQUENCE = [
          { t: 0, text: "02 · shared board" },
          { t: T_SWAP, text: "03 · live tools" },
        ];
        function textAt(time) {
          for (let i = SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
          }
          return SEQUENCE[0].text;
        }
        const chipText = document.getElementById("f05-build-chip-text");
        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: DUR,
            duration: DUR,
            ease: "none",
            onUpdate: function () {
              chipText.textContent = textAt(driver.t);
            },
